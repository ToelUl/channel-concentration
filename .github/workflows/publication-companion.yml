name: Publication companion and English documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  companion:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.13'
      - name: Verify baseline and public companion inputs
        run: |
          python -B baseline/tools/verify_release.py
          python -B companion/run.py verify
          python -B tools/check_public_docs.py
          python -B -m unittest discover -s companion/tests -v
      - name: Install the separate pinned presentation dependencies
        run: |
          python -B -m pip install --no-compile -r companion/requirements.txt
          python -B -m pip check
      - name: Render and check seven figures
        run: python -B companion/run.py render
      - name: Check a selected interacting figure and seeded coordinate failures
        run: |
          python -B companion/run.py render --fig 4 --output build/selected-figure-4
          python -B companion/tests/check_artist_refusal.py
      - name: Verify exact S2 artwork identities
        run: python -B companion/run.py verify-artwork
      - name: Preserve rendered evidence on artwork mismatch
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: failed-companion-render-${{ github.run_attempt }}
          path: |
            build/companion/render-receipt.json
            build/companion/plot-data/S1.json
            build/companion/figures/*.pdf
            build/companion/figures/*.png
          if-no-files-found: ignore
      - name: Install minimal LaTeX gallery dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y texlive-latex-base texlive-latex-recommended
      - name: Build the public figure gallery
        run: python -B companion/run.py gallery
      - name: Verify inputs remain unchanged
        run: |
          python -B baseline/tools/verify_release.py
          python -B companion/run.py verify
