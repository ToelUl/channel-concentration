name: Baseline integrity and bounded regressions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - version: 0.5.0.dev0
            source: producers/0.5.0.dev0
          - version: 0.5.1.dev0
            source: producers/0.5.1.dev0
          - version: 0.5.2.dev0
            source: software
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.13'
      - name: Verify immutable baseline bytes
        run: python -B baseline/tools/verify_release.py
      - name: Install fixed dependencies and selected wheel
        run: |
          python -B -m pip install --no-compile -r baseline/environment/requirements-pinned.txt
          python -B -m pip install --no-deps --no-compile baseline/dist/cc_repro-${{ matrix.version }}-py3-none-any.whl
          python -B -m pip check
      - name: Run detached small regressions
        env:
          SELECTED_SOURCE: ${{ matrix.source }}
        run: |
          mkdir -p "$RUNNER_TEMP/cc-tests"
          cp -R "baseline/$SELECTED_SOURCE/tests" "$RUNNER_TEMP/cc-tests/tests"
          cd "$RUNNER_TEMP/cc-tests"
          python -B -c "import cc_repro; assert 'site-packages' in cc_repro.__file__; print(cc_repro.__version__)"
          python -B -m pytest tests -q -p no:cacheprovider
      - name: Verify baseline remains unchanged
        run: python -B baseline/tools/verify_release.py

  scientific-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.13'
      - name: Install pinned companion dependencies
        run: |
          python -B -m pip install --no-compile -r companion/requirements.txt
          python -B -m pip check
      - name: Verify bounded scientific contracts
        run: python -B tools/verify_scientific_contracts.py
      - name: Verify conditional R3 refinement budgets
        run: |
          python -B r3_support/verify_refinement_budgets.py
          python -B -m unittest discover -s r3_support -p 'test_*.py' -v
      - name: Exercise scientific refusal paths
        run: python -B -m unittest discover -s tools/tests -v
      - name: Check active public documentation
        run: python -B tools/check_public_docs.py
      - name: Verify baseline remains unchanged
        run: python -B baseline/tools/verify_release.py
